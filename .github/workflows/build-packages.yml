name: Build Package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag untuk release (mis. 1.4.4). Isi untuk membuat release setelah build; kosongkan untuk build artifact saja.'
        required: false
        type: string
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cmd: npm run buildDebian
            artifact: linux-deb-package
            path: dist/app/*.deb
          - os: ubuntu-latest
            cmd: npm run buildRedhat
            artifact: linux-rpm-package
            path: dist/app/*.rpm
          - os: windows-latest
            cmd: npm run buildWindows
            artifact: windows-package
            path: |
              dist/app/*.zip
              dist/app/*.exe
          - os: macos-15
            env:
              SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
            cmd: npm run buildMacIntel
            artifact: darwin-x86-package
            path: dist/app/*.zip
          - os: macos-15
            env:
              SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
            cmd: npm run buildMacArm
            artifact: darwin-arm-package
            path: dist/app/*.zip
    env:
      SDKROOT: ${{ matrix.env.SDKROOT }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 25
    - run: npm install --omit=optional
    # https://github.com/electron-userland/electron-builder/issues/9057
    - uses: ruby/setup-ruby@v1
      if: matrix.artifact == 'linux-rpm-package'
      with:
        ruby-version: '3.3'
    - name: Install system fpm
      if: matrix.artifact == 'linux-rpm-package'
      run: |
        gem install fpm --no-document
        echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
    - name: build package
      run: ${{ matrix.cmd }}
    - name: upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.path }}

  release:
    # jalan saat push tag, atau saat manual dengan input tag terisi
    if: github.event_name == 'push' || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: download all packages
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: dist/app
    - name: create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        name: Min ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        generate_release_notes: true
        files: |
          dist/app/*.zip
          dist/app/*.exe
          dist/app/*.deb
          dist/app/*.rpm